[package]
name = "ferritron-clap"
description = "CLAP format adapter of the Ferritron audio plugin framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

# Links against `ferritron_plugin_entry`, which only plugin crates define.
[lib]
test = false
doctest = false

[dependencies]
ferritron-core.workspace = true

[build-dependencies]
cc = "1"
ferritron-build.workspace = true

# How `cargo ferritron bundle` packages this format. Any format crate can
# declare this; the CLI has no format-specific code.
[package.metadata.ferritron.format]
name = "CLAP"
entry-symbol = "clap_entry"
root = "{name}.clap"
binary = "{name}.clap"
install = { windows = "{COMMONPROGRAMFILES}/CLAP", linux = "{HOME}/.clap", macos = "{HOME}/Library/Audio/Plug-Ins/CLAP" }

# macOS: CLAP plugins are bundles there.
[package.metadata.ferritron.format.macos]
binary = "{name}.clap/Contents/MacOS/{name}"
info-plist = "macos/Info.plist"
