[package]
name = "ferritron-aax"
description = "AAX (Pro Tools) format adapter of the Ferritron audio plugin framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

# Links against `ferritron_plugin_entry`, which only plugin crates define.
[lib]
test = false
doctest = false

[dependencies]
ferritron-core.workspace = true

[build-dependencies]
cc = "1"
ferritron-build.workspace = true

# How `cargo ferritron bundle` packages AAX: `<Name>.aaxplugin`. Release
# builds must be signed with PACE's wraptool before Pro Tools loads them.
[package.metadata.ferritron.format]
name = "AAX"
entry-symbol = "ACFRegisterPlugin"
root = "{name}.aaxplugin"
binary = "{name}.aaxplugin/Contents/{arch}/{name}.aaxplugin"
arch = { windows-x86_64 = "x64", windows-aarch64 = "ARM64EC" }
install = { windows = "{COMMONPROGRAMFILES}/Avid/Audio/Plug-Ins", macos = "/Library/Application Support/Avid/Audio/Plug-Ins" }

[package.metadata.ferritron.format.macos]
binary = "{name}.aaxplugin/Contents/MacOS/{name}"
info-plist = "macos/Info.plist"
