[package]
name = "ferritron-wam"
description = "Web Audio Module (WAM 2.0) format of the Ferritron audio plugin framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Nothing to link: the plugin's WebAssembly build already exports what the
# browser side (web/*.js) calls. This crate carries the files and tells
# `cargo ferritron bundle --target web` how to package them.
[lib]
test = false
doctest = false

# The WAM folder: the plugin as WebAssembly, the WAM 2.0 module that runs
# it in an AudioWorklet, the plugin's web editor and a page to try it.
[package.metadata.ferritron.format]
name = "WAM"
entry-symbol = "ferritron_wasm_alloc"
root = "{name}.wam"
binary = "{name}.wam/plugin.wasm"
files = { "{name}.wam/descriptor.json" = "web/descriptor.json", "{name}.wam/index.html" = "web/demo.html" }
assets = { "{name}.wam/index.js" = "web/index.js", "{name}.wam/processor.js" = "web/processor.js", "{name}.wam/guest.js" = "web/guest.js", "{name}.wam/gui.js" = "web/gui.js" }
ui = "{name}.wam/gui"
