[package]
name = "ferritron"
description = "A simple, fast, extensible audio plugin framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# `testing::AllocGuard`: counts allocations on the audio thread in tests.
alloc-check = ["ferritron-core/alloc-check"]
default = ["vst3", "clap", "au", "lv2", "standalone", "auv3", "dsp"]
# DSP building blocks (SIMD, filters, delay lines, smoothers): `ferritron::dsp`.
dsp = ["dep:ferritron-dsp"]
vst3 = ["dep:ferritron-vst3"]
clap = ["dep:ferritron-clap"]
# Audio Unit v2; only builds anything on macOS.
au = ["dep:ferritron-au"]
# LV2 (Windows, macOS, Linux); needs no SDK.
lv2 = ["dep:ferritron-lv2"]
# Standalone apps: Windows, macOS, Linux, iPhone/iPad, Android.
standalone = ["dep:ferritron-standalone"]
# AUv3 (macOS, iPhone/iPad): an app extension inside the standalone app.
auv3 = ["dep:ferritron-auv3", "standalone"]
# AAX (Pro Tools); needs Avid's AAX SDK (AAX_SDK_DIR), so it is off by default.
aax = ["dep:ferritron-aax"]
# VST 2 (.dll); needs your own copy of the VST 2 SDK (VST2_SDK_DIR), so it is off by default.
vst2 = ["dep:ferritron-vst2"]
# HTML/JS editors (`[view] backend = "web"`).
web = ["dep:ferritron-web"]
# Editors drawn with wgpu (`[view] backend = "gpu"`).
gpu-view = ["dep:ferritron-gpu-view"]
# Editors drawn with Ferritron Native Graphics (`ferritron::gpu_view::FngEditor`).
fng = ["gpu-view", "ferritron-gpu-view/fng"]
# ARA 2 (`[ara]`); needs your own ARA SDK (ARA_SDK_DIR).
ara = ["dep:ferritron-ara"]

# Links against `ferritron_plugin_entry`, which only plugin crates define.
[lib]
test = false
doctest = false

[dependencies]
ferritron-core.workspace = true
ferritron-macros.workspace = true
ferritron-web = { workspace = true, optional = true }
ferritron-gpu-view = { workspace = true, optional = true }
ferritron-ara = { workspace = true, optional = true }
ferritron-dsp = { workspace = true, optional = true }

# The browser: built for WebAssembly, every plugin is also a Web Audio
# Module (`cargo ferritron bundle <package> --target web`).
[target.'cfg(target_family = "wasm")'.dependencies]
ferritron-wam.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.ferritron-standalone]
workspace = true
optional = true

# Plugin formats are for desktop builds. A plugin built for WebAssembly is a
# guest of `ferritron-wasm` (isolation Level 2), which carries the formats,
# or a WAM. Phones get apps (standalone, AUv3).
[target.'cfg(not(any(target_family = "wasm", target_os = "android", target_os = "ios")))'.dependencies]
ferritron-vst3 = { workspace = true, optional = true }
ferritron-clap = { workspace = true, optional = true }
ferritron-lv2 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ferritron-au = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
ferritron-auv3 = { workspace = true, optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ferritron-aax = { workspace = true, optional = true }
ferritron-vst2 = { workspace = true, optional = true }
