# The SDK versions Ferritron knows how to fetch, checked against this
# Ferritron release. Every part is downloaded from its publisher over HTTPS
# and checked before it is used: release files by SHA-256, source archives
# of a git commit by that commit (the archive's top folder names it).
#
# Fields per version:
#   version      the folder name under <root>/<id>/
#   recommended  the version this Ferritron release was checked with
#   license      the license's name, shown before fetching
#   license-url  the license text at that version
#   ferritron    the oldest Ferritron the version works with
#   notice       extra text shown with the license (optional)
#   parts        what to download; `into` is the folder inside the SDK
#                (submodules), "" for the SDK itself
#
# Sources (read 2026-11-07): the GitHub API's tags and submodule pins of
# each repository; xclang's release assets and their digests.

