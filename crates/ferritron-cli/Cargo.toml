[package]
name = "ferritron-cli"
description = "Build and bundling tool of the Ferritron audio plugin framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cargo-ferritron"
path = "src/main.rs"

[dependencies]
ferritron-build.workspace = true
ferritron-manifest.workspace = true
ferritron-sdk.workspace = true
# Finds MSVC to compile app launchers on Windows.
cc = "1"
fluent-syntax = "0.12"
serde_json = "1"
toml = "1"
