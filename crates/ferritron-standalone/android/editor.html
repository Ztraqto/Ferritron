<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="bridge.js"></script>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --panel: #fff; --line: #d9d9d4; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #a2a29c; --panel: #222220; --line: #3a3a37; --accent: #fb923c; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  main { padding: max(16px, env(safe-area-inset-top)) 16px 24px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .param { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .value { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range], select { width: 100%; min-height: 32px; accent-color: var(--accent); }
  .keys { display: flex; gap: 3px; margin-top: 16px; touch-action: none; user-select: none; }
  .keys div { flex: 1; height: 120px; background: #fafaf8; border: 1px solid var(--line); border-radius: 0 0 8px 8px; }
  .keys div.black { background: #1d1d1b; height: 80px; }
  .keys div.on { background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="params"></div>
  <div class="keys" id="keys" hidden></div>
</main>
<script>
const f = window.ferritron;
document.getElementById("title").textContent = f.description.name ?? "";
const root = document.getElementById("params");
const shown = {};
for (const [key, p] of [...Object.entries(f.params), ...Object.entries(f.builtins)]) {
  if (p.flags & 8) continue; // hidden
  const box = document.createElement("div");
  box.className = "param";
  const row = document.createElement("div");
  row.className = "row";
  const label = document.createElement("span");
  label.textContent = p.name;
  const value = document.createElement("span");
  value.className = "value";
  row.append(label, value);
  let input;
  if (p.kind === "enum" || p.kind === "bool") {
    input = document.createElement("select");
    const names = p.kind === "bool" ? [f.language.startsWith("ja") ? "オフ" : "Off", f.language.startsWith("ja") ? "オン" : "On"] : p.choices;
    names.forEach((n, i) => input.add(new Option(n, i)));
    input.onchange = () => f.edit(key, Number(input.value));
  } else {
    input = document.createElement("input");
    input.type = "range";
    Object.assign(input, { min: p.min, max: p.max, step: p.kind === "int" ? 1 : (p.max - p.min) / 1000 });
    input.oninput = () => f.set(key, Number(input.value));
  }
  input.setAttribute("aria-label", p.name);
  box.append(row, input);
  root.append(box);
  shown[key] = { input, value, p };
}
const show = (key, p) => {
  const s = shown[key];
  if (!s) return;
  s.value.textContent = `${p.text} ${p.unit}`.trim();
  if (document.activeElement !== s.input) s.input.value = String(p.kind === "float" ? p.value : Math.round(p.value));
};
for (const [key, s] of Object.entries(shown)) show(key, s.p);
f.onChange(show);

if (f.description.kind === "instrument") {
  const keys = document.getElementById("keys");
  keys.hidden = false;
  for (let i = 0; i < 13; i++) {
    const note = 60 + i;
    const k = document.createElement("div");
    if ([1, 3, 6, 8, 10].includes(i % 12)) k.className = "black";
    k.onpointerdown = (e) => { k.setPointerCapture(e.pointerId); k.classList.add("on"); f.midi(0x90, note, 100); };
    k.onpointerup = k.onpointercancel = () => { k.classList.remove("on"); f.midi(0x80, note, 0); };
    keys.append(k);
  }
}
</script>
</body>
</html>
