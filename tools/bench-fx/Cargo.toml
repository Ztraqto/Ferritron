[package]
name = "ferritron-bench-fx"
description = "Per-block cost benchmarks of the Ferritron framework (X0 of the 2.0 plan)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferritron = { workspace = true, default-features = false, features = ["alloc-check"] }
serde_json = "1"

[[bin]]
name = "ferritron-bench-fx"
path = "src/main.rs"
