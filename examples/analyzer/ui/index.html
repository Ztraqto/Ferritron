<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #16181d; color: #cfd3dc; font: 12px system-ui, sans-serif; }
  #title { position: absolute; left: 10px; top: 6px; }
  #state { position: absolute; right: 10px; top: 6px; opacity: .6; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <span id="title"></span><span id="state"></span>
  <script>
    // The audio thread writes `wave` into a ring, a worker computes the spectrum, and the
    // plugin hands it to the editor as the stream "spectrum": a Float32Array of 2048 dB values.
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    document.getElementById("title").textContent = ferritron.t("ui-title");
    const state = document.getElementById("state");
    state.textContent = ferritron.t("ui-waiting");
    ferritron.onStream("spectrum", (values) => {
      state.textContent = "";
      const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
      const floor = ferritron.params.floor.value;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#4dabff";
      ctx.beginPath();
      // log frequency axis: bin 1..2047
      for (let x = 0; x < w; x++) {
        const bin = Math.min(values.length - 1, Math.floor(Math.pow(values.length, x / w)));
        const y = h - 20 - (h - 40) * Math.max(0, Math.min(1, (values[bin] - floor) / -floor));
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
  </script>
</body>
</html>
